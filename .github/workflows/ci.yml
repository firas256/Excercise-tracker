name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Motion core unit tests
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v5
      - name: swift test
        run: swift test

  build-apps:
    name: Build iPhone + Watch apps
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Xcode version and SDKs
        run: |
          xcodebuild -version
          xcodebuild -showsdks
      - name: Build iPhone app (embeds the Watch app)
        run: |
          xcodebuild -project ExerciseTracker.xcodeproj -scheme ExerciseTracker \
            -configuration Debug -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO -quiet build
      - name: Build Watch app on its own
        run: |
          xcodebuild -project ExerciseTracker.xcodeproj -scheme "ExerciseTracker Watch App" \
            -configuration Debug -destination 'generic/platform=watchOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO -quiet build
      - name: Build for release (what goes to the App Store)
        run: |
          xcodebuild -project ExerciseTracker.xcodeproj -scheme ExerciseTracker \
            -configuration Release -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO -quiet build
      - name: Release app contains its privacy manifests and App Store keys
        run: |
          app=$(find ~/Library/Developer/Xcode/DerivedData -path "*Release-iphoneos/ExerciseTracker.app" -maxdepth 6 -type d | head -1)
          echo "app: $app"
          test -f "$app/PrivacyInfo.xcprivacy"
          watch=$(find "$app/Watch" -name "*.app" -maxdepth 1 -type d | head -1)
          echo "watch: $watch"
          test -f "$watch/PrivacyInfo.xcprivacy"
          plutil -lint "$app/PrivacyInfo.xcprivacy" "$watch/PrivacyInfo.xcprivacy"
          test "$(plutil -extract ITSAppUsesNonExemptEncryption raw "$app/Info.plist")" = "false"
          test "$(plutil -extract LSApplicationCategoryType raw "$app/Info.plist")" = "public.app-category.healthcare-fitness"
          for key in NSHealthShareUsageDescription NSHealthUpdateUsageDescription; do plutil -extract $key raw "$app/Info.plist" > /dev/null; done
          plutil -extract NSMotionUsageDescription raw "$watch/Info.plist" > /dev/null

  model-check:
    name: Core ML model matches its PyTorch source
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check the shipped exercise model
        run: |
          python -m venv .venv
          .venv/bin/pip install -q coremltools numpy
          .venv/bin/python ML/training/check_coreml.py WatchApp/ML/ExerciseActivityClassifier.mlpackage ML/training/fixtures
