name: Simulator UI tests

# Runs the iPhone and Watch UI tests in the Simulator (the watch uses scripted motion, see
# Shared/Processing/MotionScript.swift) and uploads a screenshot of every screen.
on:
  workflow_dispatch:

jobs:
  ui-tests:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Pick simulators
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, subprocess
          d = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))["devices"]
          def pick(platform, prefix):
              for runtime in sorted(d, reverse=True):
                  if platform in runtime:
                      for dev in d[runtime]:
                          if dev["name"].startswith(prefix):
                              return dev["udid"]
              return ""
          print("PHONE=" + pick("iOS", "iPhone"))
          print("WATCH=" + pick("watchOS", "Apple Watch"))
          PY
          cat "$GITHUB_ENV"
      # A simulator that's still finishing its boot can time out the first app launch.
      - name: Boot the iPhone simulator
        run: |
          xcrun simctl boot "$PHONE" || true
          xcrun simctl bootstatus "$PHONE" -b || true
      # Both test steps may fail without stopping the job (so screenshots are always exported);
      # the last step then fails the job if either did.
      - name: iPhone UI tests
        id: iphone
        timeout-minutes: 25
        continue-on-error: true
        run: |
          mkdir -p results
          xcodebuild test -project ExerciseTracker.xcodeproj -scheme ExerciseTracker \
            -destination "id=$PHONE" -resultBundlePath results/iphone.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | grep -E "Test Case|error:|XCTAssert|\*\* TEST" ; exit ${PIPESTATUS[0]}
      - name: Free the machine for the Watch simulator
        if: always()
        run: |
          # A booted iPhone simulator competes for CPU; a cold watch simulator can time out on the
          # first app launch. Shut one down and fully boot the other first.
          xcrun simctl shutdown "$PHONE" || true
          xcrun simctl boot "$WATCH" || true
          xcrun simctl bootstatus "$WATCH" -b || true
      - name: Watch UI tests
        id: watch
        timeout-minutes: 25
        continue-on-error: true
        run: |
          xcodebuild test -project ExerciseTracker.xcodeproj -scheme "ExerciseTracker Watch App" \
            -destination "id=$WATCH" -resultBundlePath results/watch.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | grep -E "Test Case|error:|XCTAssert|\*\* TEST" ; exit ${PIPESTATUS[0]}
      - name: Export screenshots
        if: always()
        run: |
          python3 scripts/export_screenshots.py results shots
          mkdir -p preview
          for f in shots/*.png; do sips -Z 900 -s format jpeg -s formatOptions 70 "$f" --out "preview/$(basename "${f%.png}").jpg" >/dev/null; done
          ls -la preview
      - name: Collect crash reports and test summaries
        if: always()
        run: |
          mkdir -p preview/diagnostics
          find ~/Library/Logs/DiagnosticReports -name "*ExerciseTracker*" -exec cp {} preview/diagnostics/ \; 2>/dev/null || true
          for r in results/*.xcresult; do
            xcrun xcresulttool get test-results tests --path "$r" > "preview/diagnostics/$(basename "$r" .xcresult)-tests.json" 2>&1 || true
          done
          ls -la preview/diagnostics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: preview/
      - name: Full-resolution screenshots for the App Store
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-store-screenshots
          path: shots/*.png
      - name: Fail if any UI test failed
        if: always()
        run: |
          echo "iPhone UI tests: ${{ steps.iphone.outcome }}, Watch UI tests: ${{ steps.watch.outcome }}"
          test "${{ steps.iphone.outcome }}" = "success" && test "${{ steps.watch.outcome }}" = "success"
